<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:32px;background:#fff;color:var(--sp-text)}h4{font-family:var(--sp-font-display);font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--sp-muted);margin:0 0 14px}.grp{margin-bottom:28px}.spacing{display:flex;align-items:flex-end;gap:10px}.bar{background:var(--sp-orange);height:40px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--sp-font-mono);font-size:10px}.radii{display:flex;gap:14px}.box{width:70px;height:70px;background:var(--sp-light-blue);border:1px solid var(--sp-border);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-family:var(--sp-font-mono);font-size:10px;color:var(--sp-navy)}.shadows{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.sh{aspect-ratio:1;background:#fff;border-radius:10px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-family:var(--sp-font-mono);font-size:10px;color:var(--sp-muted)}</style></head><body>
<div class="grp"><h4>Spacing (4 px base)</h4><div class="spacing"><div class="bar" style="width:4px">4</div><div class="bar" style="width:8px">8</div><div class="bar" style="width:12px">12</div><div class="bar" style="width:16px">16</div><div class="bar" style="width:24px">24</div><div class="bar" style="width:32px">32</div><div class="bar" style="width:48px">48</div><div class="bar" style="width:64px">64</div><div class="bar" style="width:96px">96</div><div class="bar" style="width:128px">128</div></div></div>
<div class="grp"><h4>Corner radii</h4><div class="radii"><div class="box" style="border-radius:4px">4</div><div class="box" style="border-radius:6px">6</div><div class="box" style="border-radius:10px">10</div><div class="box" style="border-radius:16px">16</div><div class="box" style="border-radius:24px">24</div><div class="box" style="border-radius:999px">pill</div></div></div>
<div class="grp"><h4>Shadows</h4><div class="shadows"><div class="sh" style="box-shadow:var(--sp-shadow-xs)">xs</div><div class="sh" style="box-shadow:var(--sp-shadow-sm)">sm</div><div class="sh" style="box-shadow:var(--sp-shadow-md)">md</div><div class="sh" style="box-shadow:var(--sp-shadow-lg)">lg</div><div class="sh" style="box-shadow:var(--sp-shadow-heat)">heat</div></div></div>
</body></html>
