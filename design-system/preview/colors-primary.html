<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:24px;background:#fff;font-family:var(--sp-font-body)}.row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.sw{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;border:1px solid var(--sp-border)}.sw b{font-family:var(--sp-font-display);font-size:12px;font-weight:700;display:block;margin-bottom:2px}.sw code{font-family:var(--sp-font-mono);font-size:10px;opacity:.75}</style></head><body>
<div class="row">

<div class="sw" style="background:#FFF4E8;color:#242E43"><b>Cream</b><code>#FFF4E8</code></div>
<div class="sw" style="background:#041C72;color:#FFF4E8"><b>Navy</b><code>#041C72</code></div>
<div class="sw" style="background:#242E43;color:#FFF4E8"><b>Dark Navy</b><code>#242E43</code></div>
<div class="sw" style="background:#EBF1FF;color:#041C72"><b>Light Blue</b><code>#EBF1FF</code></div>
</div></body></html>
