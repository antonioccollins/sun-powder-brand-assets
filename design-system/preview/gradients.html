<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css"><style>body{margin:0;padding:24px;background:#fff;font-family:var(--sp-font-body)}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.g{aspect-ratio:1.2;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;color:#fff;border:1px solid var(--sp-border)}.g b{font-family:var(--sp-font-display);font-size:13px;font-weight:700;display:block}.g code{font-family:var(--sp-font-mono);font-size:10px;opacity:.85}</style></head><body>
<div class="row">
<div class="g" style="background:var(--sp-grad-heat)"><b>Heat (CTA)</b><code>135° orange → amber</code></div>
<div class="g" style="background:var(--sp-grad-heat-vert)"><b>Heat / vertical</b><code>180° #FF2331 → #FF9C00</code></div>
<div class="g" style="background:var(--sp-grad-navy-glow)"><b>Navy glow</b><code>radial 70/20</code></div>
<div class="g" style="background:var(--sp-grad-orange-glow)"><b>Orange glow</b><code>radial 50/25</code></div>
</div></body></html>
